# Seeded Defect Set — jpm-llm-suite
# Layer 2 of the eval design (see ../../EVALS.md).
#
# Usage: AFTER a clean pipeline run, make a copy of the run directory,
# inject each defect below into the copy, run /verify-all on the copy,
# and score: recall = defects flagged / defects injected;
# note any false alarms separately.
#
# Rules:
# - Inject into the COPY only; never into the fixture or a golden run.
# - Adjust exact figures/quotes to match the actual draft at run time —
#   each defect specifies the KIND of corruption, targeted at real content.
# - Every real-world verification miss discovered in production should be
#   added here as a new defect (bump the version).
#
# Provenance note: defects D1, D2, D9 are modeled on real issues surfaced
# in the v3.0 Moderna power-user test (financial errors, late-found bias).
#
# Version 3 adds D17-D19 from the first FIELD test — two complete case packages
# built against v3.8.0 by an operator other than the author, on cases the author
# did not choose. These are the first seeded defects drawn from outside the
# author's own runs. Subjects are deliberately not named: the finding is the kit
# behavior, not the case.

version: 3
date: "2026-08-26"
defects:
  - id: D1
    layer: financial
    injection_target: main_case_draft
    instruction: >-
      Change one revenue or investment figure in the Main Case to a
      plausible but wrong value (e.g., alter a $2B figure to $2.4B)
      while leaving the source documents untouched.
    expected_detector: "/validate-financials or /verify-consistency"

  - id: D2
    layer: financial
    injection_target: main_case_draft
    instruction: >-
      Break one percentage: change a derived percentage so it no longer
      matches the underlying numbers stated in the same document.
    expected_detector: "/validate-financials"

  - id: D3
    layer: quote
    injection_target: main_case_draft
    instruction: >-
      Misattribute one real quote: keep the exact wording from a source
      but attribute it to a different named executive.
    expected_detector: "/verify-quotes (speaker mismatch)"

  - id: D4
    layer: quote
    injection_target: main_case_draft
    instruction: >-
      Insert one fabricated quote: plausible in voice and topic, attributed
      to the protagonist, appearing in no source document.
    expected_detector: "/verify-quotes (APOCRYPHAL verdict)"

  - id: D5
    layer: quote
    injection_target: main_case_draft
    instruction: >-
      Silently paraphrase one quoted passage: keep quotation marks but
      alter 3-5 words from the source wording.
    expected_detector: "/verify-quotes (should downgrade from VERIFIED)"

  - id: D6
    layer: timeline
    injection_target: supplement_draft
    instruction: >-
      Shift one dated event by several months so it contradicts the date
      given for the same event in the Main Case.
    expected_detector: "/verify-consistency or /verify-cross-document"

  - id: D7
    layer: attribution
    injection_target: supplement_draft
    instruction: >-
      Add one specific statistic with a vague attribution ("analysts
      estimate...") and no source.
    expected_detector: "/verify-sources"

  - id: D8
    layer: links
    injection_target: additional_sources_draft
    instruction: >-
      Replace one working bibliography URL with a plausible dead URL
      (404) on the same domain.
    expected_detector: "/verify-links"

  - id: D9
    layer: bias
    injection_target: source_registry
    instruction: >-
      Remove the two most independent/critical sources from the registry
      copy (leaving mostly company-generated and friendly coverage), then
      re-run the bias assessment.
    expected_detector: "/assess-bias (risk should rise to MEDIUM/HIGH)"

  - id: D10
    layer: cross_document
    injection_target: teaching_note_draft
    instruction: >-
      Change one discussion question so it references a case exhibit or
      section that does not exist.
    expected_detector: "/verify-cross-document"

  # ---- v2 additions: real failure classes discovered in production runs ----
  # D11-D12 were found by the baseline authoring run (the writer produced them
  # while following the rules). D13-D14 were found by the 2026-07-27 coach probe
  # in material that had already passed two expert review passes.

  - id: D11
    layer: quote_integrity
    injection_target: main_case_draft
    instruction: >-
      Splice two quotations: take a passage the subject said in answer to one
      question and join it, inside a single set of quotation marks, to a passage
      answering a different question.
    expected_detector: "/verify-quotes (MODIFIED — spliced)"
    provenance: "Real defect produced by the v3.2.0 baseline authoring run"

  - id: D12
    layer: quote_integrity
    injection_target: main_case_draft
    instruction: >-
      Silently correct a garbled ASR word inside quotation marks (remove the
      square brackets from an existing bracketed correction, or fix a corrupted
      word without marking it).
    expected_detector: "/verify-quotes (MODIFIED — silently corrected)"
    provenance: "Real defect produced by the v3.2.0 baseline authoring run"

  - id: D13
    layer: source_independence
    injection_target: source_registry
    instruction: >-
      Remove the Independence annotation from a source that carries a commercial
      interest (a sponsored podcast episode, or a consultancy summarizing its own
      research), leaving it presented as a neutral primary source.
    expected_detector: "/assess-sources source-integrity check; /assess-bias interested-voice flag"
    provenance: "Real gap found 2026-07-27: vendor sponsorship recorded nowhere despite two prior review passes"

  - id: D14
    layer: source_processing
    injection_target: main_case_draft
    instruction: >-
      Quote verbatim, inside quotation marks, from a source that states it was
      edited for clarity and length — and add a document assertion that all
      quotations are verbatim from primary sources.
    expected_detector: "/verify-quotes (MODIFIED — edited source) + integrity-claim audit in /add-disclaimers"
    provenance: "Real gap found 2026-07-27: McKinsey source self-declares editing; case quoted it as verbatim"

  - id: D15
    layer: consistency
    injection_target: supplement_draft
    instruction: >-
      Introduce a third, unreconciled value for a figure that already differs
      between two sources (e.g., a workforce headcount), presenting it without
      noting the conflict.
    expected_detector: "/verify-consistency; should surface the conflict rather than pick a value"
    provenance: "Real gap found 2026-07-27: three headcount figures (317K/400K/600K) unreconciled across sources"

  - id: D16
    layer: attribution
    injection_target: main_case_draft
    instruction: >-
      Convert assent into assertion: find a place where an interviewer states a
      figure and the subject merely agrees, and present the figure as the
      subject's own statement.
    expected_detector: "/verify-quotes (MODIFIED — assent converted to assertion)"
    provenance: "Real gap found 2026-07-27: the case's title number was asserted by the host, assented to by the subject"

  # --- v3 — from the first field test (2026-08-26) ---

  - id: D17
    layer: quote_integrity
    injection_target: main_case_draft
    instruction: >-
      Corrupt four quotations in four different ways against untouched source
      files: (a) silently drop two or three words from the middle of a quote,
      (b) reverse a comparison inside a quote so the source's "more X than Y"
      becomes "X, not Y", (c) pull the sentence's framing clause inside the
      quotation marks so words the author wrote appear as the speaker's, and
      (d) place a constructed illustration the author invented inside quotation
      marks and attribute it to a named source.
    expected_detector: "/verify-all must report FAIL on quotes; /verify-quotes must return MODIFIED for (a)-(c) and APOCRYPHAL for (d)"
    provenance: >-
      Field test 2026-07/08: /verify-all reported PASS on quotes for a document
      set containing all four of these; a later span-by-span file trace found
      them. The quote check had reasoned about source categories rather than
      enumerating individual quoted spans.

  - id: D18
    layer: source_independence
    injection_target: source_registry
    instruction: >-
      Build a registry of 25 or more sources in which at least 80% are COMPANY
      or INTERESTED/self, while leaving at least one INDEPENDENT source present
      so the existing floor-of-one check is satisfied. Keep depth genuinely
      high — abundant dated first-person material from the subject.
    expected_detector: "/assess-sources must NOT return GREEN, and must not return an unqualified YELLOW; the independence proportion must appear as a gating input, not only as prose"
    provenance: >-
      Field test 2026-07/08: a base at ~82% self/company scored YELLOW and
      writing proceeded, because Depth and Completeness reward volume and
      independence entered the gate only as a floor of one source. The report
      named the imbalance correctly and did not act on it.

  - id: D19
    layer: quote_integrity
    injection_target: source_registry
    instruction: >-
      Register a source whose only on-disk artifact is a summarizing dossier —
      an agent-written digest of a page read live in a browser — and quote it
      verbatim in the Main Case. The exact wording must appear in no committed
      file.
    expected_detector: "/verify-quotes must flag the quotation as untraceable (APOCRYPHAL or equivalent), never VERIFIED"
    provenance: >-
      Field test 2026-07/08: quotations captured live via browser reads were
      summarized into a bio dossier, so the verbatim text existed only in the
      session and traced to no file. Fixed at the time by saving the raw
      capture retroactively; /add-sources never prompted for it.
