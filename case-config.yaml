# -----------------------------------------------------------------------------
# CASE INFORMATION
# -----------------------------------------------------------------------------
case:
  # Full company name as it appears in formal documents
  company_name: "Company Name"           # e.g., "CompanyXYZ, Inc."

  # Short name for file naming and casual references
  company_short: "Company"               # e.g., "CompanyXYZ"

  # Brief description of the case topic
  topic: "Topic Description"             # e.g., "Enterprise AI Transformation"

  # Primary decision-maker the case follows
  protagonist_name: "Protagonist Name"   # e.g., "Jane Doe"
  protagonist_title: "Title"             # e.g., "Chief Operating Officer"

  # Case type: "business" or "public_policy"
  case_type: "business"                  # For public policy cases, set to "public_policy"

# -----------------------------------------------------------------------------
# COURSE INFORMATION
# -----------------------------------------------------------------------------
course:
  # Course identifier
  name: "Course Name"                    # e.g., "ITEC-617"

  # School or program name
  institution: "Institution"             # e.g., "Kogod School of Business"

  # When the case will be taught
  semester: "Semester Year"              # e.g., "Spring 2026"

# -----------------------------------------------------------------------------
# DOCUMENT SETTINGS
# -----------------------------------------------------------------------------
documents:
  # Which documents this course expects the AUTHOR to produce, in order.
  # Skills read this list — /write-document sequences from it, and /verify-all and
  # /verify-cross-document only require what it names. Remove a document here and the
  # kit stops asking for it; the skill that writes it still exists and can be run on
  # request. Teaching Notes are commonly authored by the instructor rather than the
  # student, which is what dropping "teaching_note" from this list expresses.
  required:
    - additional_sources
    - main_case
    - supplement
    - teaching_note

  # Target word counts. Defaults are sized for a working professional writing alongside
  # a full-time job; a full-length teaching case runs roughly double. Raise them if your
  # authors have more time than a typical MBA cohort.
  #   Lighter (default):  Main 2,500-3,500 | Supplement 1,000-1,500
  #   Full length:        Main 4,000-6,000 | Supplement 2,500-4,000
  target_word_counts:
    main_case: 3000
    supplement: 1200
    teaching_note: 2000
    additional_sources: 2500

  # Classroom session length in minutes (typical: 75-90)
  session_length_minutes: 80

# -----------------------------------------------------------------------------
# REPOSITORY SETTINGS
# -----------------------------------------------------------------------------
repository:
  # Keep private to protect unpublished case content
  private: true

  # License for the case materials YOU produce (your choice — separate from
  # the starter kit itself, which is MIT-licensed).
  # CC-BY-NC-4.0 = Attribution required, non-commercial use only —
  # a sensible default for educational case materials.
  license: "CC-BY-NC-4.0"

# -----------------------------------------------------------------------------
# TEMPLATE METADATA (do not modify)
# -----------------------------------------------------------------------------
template:
  # Version of the template this project was created from
  version: "4.1.0"

  # Source repository for updates
  source: "https://github.com/leifulstrup/Agentic-AI-Case-Study-Development-Starter-Kit"
