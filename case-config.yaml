# ║  Example (illustrative placeholders — replace with your real case):        ║
# ║    company_name: "CompanyXYZ, Inc."                                        ║
# ║    company_short: "CompanyXYZ"                                             ║
# ║    topic: "Factory Automation and Manufacturing Innovation"                ║
# ║    protagonist_name: "Jane Doe"                                            ║
# ║    protagonist_title: "VP of Engineering"                                  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# -----------------------------------------------------------------------------
# CASE INFORMATION
# -----------------------------------------------------------------------------
case:
  # Full company name as it appears in formal documents
  company_name: "Company Name"           # e.g., "CompanyXYZ, Inc."

  # Short name for file naming and casual references
  company_short: "Company"               # e.g., "CompanyXYZ"

  # Brief description of the case topic
  topic: "Topic Description"             # e.g., "Enterprise AI Transformation"

  # Primary decision-maker the case follows
  protagonist_name: "Protagonist Name"   # e.g., "Jane Doe"
  protagonist_title: "Title"             # e.g., "Chief Operating Officer"

  # Case type: "business" or "public_policy"
  case_type: "business"                  # For public policy cases, set to "public_policy"

# -----------------------------------------------------------------------------
# COURSE INFORMATION
# -----------------------------------------------------------------------------
course:
  # Course identifier
  name: "Course Name"                    # e.g., "ITEC-617"

  # School or program name
  institution: "Institution"             # e.g., "Kogod School of Business"

  # When the case will be taught
  semester: "Semester Year"              # e.g., "Spring 2026"

# -----------------------------------------------------------------------------
# DOCUMENT SETTINGS
# -----------------------------------------------------------------------------
documents:
  # Which documents this course expects the AUTHOR to produce, in order.
  # Skills read this list — /write-document sequences from it, and /verify-all and
  # /verify-cross-document only require what it names. Remove a document here and the
  # kit stops asking for it; the skill that writes it still exists and can be run on
  # request. Teaching Notes are commonly authored by the instructor rather than the
  # student, which is what dropping "teaching_note" from this list expresses.
  required:
    - additional_sources
    - main_case
    - supplement
    - teaching_note

  # Target word counts, in words. At roughly 250 words per page:
  #   main_case          2,000-3,000  ( 8-12 pp.)   default 2,500 (10 pp.)
  #   supplement         1,200-2,000  ( 5- 8 pp.)   default 1,500 ( 6 pp.)
  #   teaching_note      1,500-2,000  ( 6- 8 pp.)   default 1,500 ( 6 pp.)
  #   additional_sources 1,500-2,500  ( 6-10 pp.)   default 2,000 ( 8 pp.)  <- see note
  #
  # additional_sources is a GUIDE, not a ceiling. It is the evidence file: every quotation
  # the other documents use has to be traceable through it. Cutting entries to hit the
  # number severs chains of custody silently. If it runs long, let it run long and take
  # the reduction out of the prose documents instead.
  #
  # These are deliberately modest — about half a full-length published teaching case,
  # which runs 4,000-6,000 words for the main case alone. The reasoning is practical
  # rather than stylistic: the author is usually writing alongside a full-time job, and
  # the reviewer is a professor working through a stack of these. A case nobody finishes
  # reading teaches nothing, and a case too long to revise does not get revised.
  #
  # Raise them if your authors have the time and the case genuinely needs the room --
  # /setup-case asks, and you can edit these at any point without redoing anything.
  target_word_counts:
    main_case: 2500
    supplement: 1500
    teaching_note: 1500
    additional_sources: 2000

  # Classroom session length in minutes (typical: 75-90)
  session_length_minutes: 80

# -----------------------------------------------------------------------------
# REPOSITORY SETTINGS
# -----------------------------------------------------------------------------
repository:
  # Keep private to protect unpublished case content
  private: true

  # License for the case materials YOU produce (your choice — separate from
  # the starter kit itself, which is MIT-licensed).
  # CC-BY-NC-4.0 = Attribution required, non-commercial use only —
  # a sensible default for educational case materials.
  license: "CC-BY-NC-4.0"

# -----------------------------------------------------------------------------
# TEMPLATE METADATA (do not modify)
# -----------------------------------------------------------------------------
template:
  # Version of the template this project was created from
  version: "4.5.0"

  # Source repository for updates
  source: "https://github.com/leifulstrup/Agentic-AI-Case-Study-Development-Starter-Kit"
